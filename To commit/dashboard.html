<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead QA Dashboard - iSON</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body style="padding: 30px; display: block; overflow-y: auto;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h1 style="color: var(--primary); margin: 0; display: flex; align-items: center; gap: 15px;">
      <span style="font-size: 2rem;">📊</span> Lead QA - Global Progress Dashboard
    </h1>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-primary" style="margin: 0;" onclick="location.reload()">🔄 Refresh</button>
      <a href="index.html" class="btn" style="margin: 0; background: var(--surface); color: var(--text); border: 1px solid var(--border);">Back to Portal</a>
    </div>
  </div>

  <div style="background: var(--card-bg); padding: 30px; border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--border);">
    <h3 style="margin-top: 0; margin-bottom: 20px;">Real-Time User Story Compliance</h3>
    
    <div style="overflow-x: auto;">
      <table id="user-story-dashboard-table" style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr>
            <th style="padding: 15px; border-bottom: 2px solid var(--border);">User Story Key</th>
            <th style="padding: 15px; border-bottom: 2px solid var(--border);">Tester</th>
            <th style="padding: 15px; border-bottom: 2px solid var(--border);">Overall SOP Compliance</th>
            <th style="padding: 15px; border-bottom: 2px solid var(--border);">Last Updated</th>
            <th style="padding: 15px; border-bottom: 2px solid var(--border);">Status</th>
            <th style="padding: 15px; border-bottom: 2px solid var(--border); text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="dashboard-tbody">
          <tr><td colspan="6" style="text-align: center; padding: 20px;">Loading live data from Firebase...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBQG6GHxApLRSgBnQvXWrfdgrIf9sEacRA",
      authDomain: "qa-lead-dashboard.firebaseapp.com",
      projectId: "qa-lead-dashboard",
      storageBucket: "qa-lead-dashboard.firebasestorage.app",
      messagingSenderId: "946430881036",
      appId: "1:946430881036:web:1c0281b84acc89fd19ed29",
      measurementId: "G-7Y3YPX7XNS",
      databaseURL: "https://qa-lead-dashboard-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tbody = document.getElementById('dashboard-tbody');
    const storiesRef = ref(db, 'user_stories');
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };
    
    window.deleteStoryFromCloud = async function(storyKey) {
      if (confirm(`Are you sure you want to completely erase ${storyKey} from the cloud database?`)) {
        try {
          await update(ref(db), { ['user_stories/' + storyKey]: null });
          console.log(`Deleted ${storyKey} from cloud.`);
        } catch(e) {
          alert("Error deleting from cloud.");
        }
      }
    };

    // Listen to real-time updates from Realtime Database
    onValue(storiesRef, (snapshot) => {
      tbody.innerHTML = ''; // Clear loading state
      
      if (!snapshot.exists()) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">No user stories active.</td></tr>';
        return;
      }

      snapshot.forEach((childSnapshot) => {
        const data = childSnapshot.val();
        const key = childSnapshot.key;
        const tester = data.assignedToName || 'Unknown Tester';
        const progress = data.overallProgress || 0;
        const date = data.lastUpdated ? new Date(data.lastUpdated).toLocaleString() : 'Unknown';
        
        const isComplete = progress === 100;
        const statusBadge = isComplete 
          ? `<span style="background: #10b981; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;">COMPLETE</span>`
          : `<span style="background: #f59e0b; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;">IN PROGRESS</span>`;

        // Progress Bar
        const progressHtml = `
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 100px; height: 8px; background: rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden;">
              <div style="width: ${progress}%; height: 100%; background: var(--primary); transition: width 0.5s;"></div>
            </div>
            <span>${progress}%</span>
          </div>
        `;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="padding: 15px; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--primary);">${key}</td>
          <td style="padding: 15px; border-bottom: 1px solid var(--border); color: #334155; font-weight: 500;">👤 ${tester}</td>
          <td style="padding: 15px; border-bottom: 1px solid var(--border);">${progressHtml}</td>
          <td style="padding: 15px; border-bottom: 1px solid var(--border); color: #777; font-size: 0.9rem;">${date}</td>
          <td style="padding: 15px; border-bottom: 1px solid var(--border);">${statusBadge}</td>
          <td style="padding: 15px; border-bottom: 1px solid var(--border); text-align: center;"><button class="btn" style="background: #ef4444; color: white; padding: 5px 10px; font-size: 0.8rem;" onclick="deleteStoryFromCloud('${key}')">Delete</button></td>
        `;
        tbody.appendChild(tr);

        // Fun interaction: If someone hits 100% while QA is watching, trigger confetti
        if (isComplete && !tr.dataset.confettiFired && typeof confetti === 'function') {
          tr.dataset.confettiFired = true;
          confetti({ particleCount: 50, spread: 40, origin: { y: 0.1 } });
        }
      });
    });
  </script>
</body>
</html>
