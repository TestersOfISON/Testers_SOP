name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run a daily scan at midnight UTC
    - cron: '0 0 * * *'

jobs:
  audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run npm audit
        run: |
          # If a package.json doesn't exist yet, we initialize a dummy one to prevent action failure
          if [ ! -f package.json ]; then
            echo "No package.json found. Creating a dummy package.json to satisfy audit..."
            npm init -y
          fi
          
          # npm audit requires a package-lock.json. If it doesn't exist, generate it.
          if [ ! -f package-lock.json ]; then
            echo "Generating package-lock.json for audit..."
            npm install --package-lock-only
          fi
          
          # Run the audit and fail ONLY on 'high' or 'critical' vulnerabilities
          npm audit --audit-level=high
