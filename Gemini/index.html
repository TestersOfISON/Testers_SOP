<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iSON - Tester's SOP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc; /* Slate 50 */
      --text-color: #0f172a; /* Slate 900 */
      --sidebar-bg: #0f172a; /* Slate 900 */
      --sidebar-text: #94a3b8; /* Slate 400 */
      --header-bg: #0f172a;
      --card-bg: #ffffff;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --primary: #2563eb; /* Blue 600 */
      --primary-hover: #1d4ed8; /* Blue 700 */
      --success: #10b981; /* Emerald 500 */
      --danger: #ef4444; /* Red 500 */
      --border: #e2e8f0; /* Slate 200 */
      --input-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    [data-theme="dark"] {
      --bg-color: #0f172a; /* Slate 900 */
      --text-color: #f1f5f9; /* Slate 100 */
      --sidebar-bg: #1e293b; /* Slate 800 */
      --sidebar-text: #cbd5e1; /* Slate 300 */
      --header-bg: #0f172a;
      --card-bg: #1e293b; /* Slate 800 */
      --nav-bg: rgba(30, 41, 59, 0.85);
      --border: #334155; /* Slate 700 */
      --input-bg: #1e293b;
      --primary: #3b82f6; /* Blue 500 */
      --primary-hover: #60a5fa; /* Blue 400 */
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
    }

    * { box-sizing: border-box; }
    body { font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }

    /* Layout */
    .sidebar { width: 300px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Sidebar toggle button (hidden on desktop) */
    .sidebar-toggle-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-color);
      padding: 5px;
      margin-right: 5px;
      transition: color 0.2s;
    }
    
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 9;
      animation: fadeIn 0.2s ease-out;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -300px;
        bottom: 0;
        width: 300px;
        z-index: 100;
      }
      .sidebar.open {
        transform: translateX(300px);
      }
      .sidebar-toggle-btn {
        display: block;
      }
      .sidebar-overlay.active {
        display: block;
      }
    }
    .sidebar-header { padding: 20px; font-size: 1.25rem; font-weight: bold; background: var(--header-bg); text-align: center; border-bottom: 1px solid var(--border); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .accordion { width: 100%; text-align: left; background: none; color: var(--sidebar-text); padding: 15px 20px; border: none; outline: none; cursor: pointer; font-size: 1rem; border-bottom: 1px solid var(--border); transition: all 0.2s ease; font-weight: 500; }
    .accordion:hover, .accordion.active { background: rgba(255,255,255,0.03); color: #fff; }
    .accordion::after { content: '\002B'; float: right; font-weight: bold; }
    .accordion.active::after { content: "\2212"; }
    .panel { padding: 0; background-color: rgba(0,0,0,0.1); max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .panel-btn { display: block; width: 100%; text-align: left; padding: 12px 20px 12px 40px; background: none; border: none; color: var(--sidebar-text); cursor: pointer; transition: all 0.2s ease; font-size: 0.95rem; }
    .panel-btn:hover, .panel-btn.active-module { color: #fff; background: rgba(37, 99, 235, 0.15); border-left: 4px solid var(--primary); }

    .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-nav { height: 60px; background: var(--nav-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-shadow: var(--shadow); z-index: 5; backdrop-filter: blur(10px); }
    .theme-toggle { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 0.9rem; }
    .theme-toggle:hover { background: var(--primary-hover); transform: translateY(-1px); }
    
    .content-area { padding: 30px; overflow-y: auto; flex-grow: 1; }
    
    /* Tabs */
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 25px; flex-wrap: wrap; gap: 5px; }
    .tab-btn { background: transparent; border: none; padding: 12px 20px; font-size: 1rem; cursor: pointer; color: var(--text-color); border-bottom: 3px solid transparent; transition: all 0.2s; border-radius: 6px 6px 0 0; font-weight: 500; }
    .tab-btn:hover { background: rgba(37, 99, 235, 0.05); }
    .tab-btn.active { border-bottom-color: var(--primary); font-weight: bold; color: var(--primary); background: rgba(37, 99, 235, 0.05); }
    .tab-content { display: none; background: var(--card-bg); padding: 30px; border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--border); animation: fadeIn 0.3s ease-in-out; }
    .tab-content.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Elements */
    .guideline-list { line-height: 1.8; font-size: 1.05rem; }
    .guideline-list li { margin-bottom: 10px; }
    
    .checklist-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); transition: background 0.2s; border-radius: 4px; }
    .checklist-item:hover { background: rgba(0,0,0,0.015); }
    [data-theme="dark"] .checklist-item:hover { background: rgba(255,255,255,0.015); }
    .checklist-item label { margin-left: 12px; flex-grow: 1; cursor: pointer; font-size: 1.05rem; }
    .checklist-item input[type="checkbox"] { transform: scale(1.3); cursor: pointer; accent-color: var(--primary); }
    .checklist-item input[type="checkbox"]:disabled { opacity: 0.4; cursor: not-allowed; }
    .checklist-item input[type="checkbox"]:disabled + label { opacity: 0.5; cursor: not-allowed; }
    
    /* Form Inputs */
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; color: #777; }
    .form-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--input-bg); color: var(--text-color); font-family: inherit; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
    .execution-details-box { background: rgba(37, 99, 235, 0.02); padding: 25px; border-radius: 8px; border: 1px solid rgba(37, 99, 235, 0.15); margin-bottom: 30px; }

    .btn { padding: 10px 18px; margin: 15px 10px 0 0; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.15s ease; }
    .btn:active { transform: scale(0.96); }
    .btn:hover { filter: brightness(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    
    /* Logs */
    .log-entry { padding: 20px; border-left: 5px solid var(--primary); background: var(--bg-color); margin-bottom: 20px; border-radius: 0 8px 8px 0; box-shadow: var(--shadow); }
    .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .log-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; font-size: 0.95rem; }
    .log-item span { display: block; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .log-item strong { color: var(--text-color); font-weight: 600; }
    
    .code-block { background: #1e293b; color: #cbd5e1; padding: 20px; border-radius: 8px; font-family: monospace; overflow-x: auto; white-space: pre-wrap; line-height: 1.5; border: 1px solid var(--border); }
    
    .mermaid-wrapper { display: flex; justify-content: center; background: white; padding: 30px; border-radius: 8px; overflow-x: auto; border: 1px solid #eee; }
    [data-theme="dark"] .mermaid-wrapper { background: #dcdde1; border-color: #dcdde1; }

    /* Search Styling */
    .search-container { position: relative; margin: 0 20px; flex-grow: 1; max-width: 450px; }
    #global-search { width: 100%; padding: 10px 16px 10px 38px; border: 1px solid var(--border); border-radius: 24px; background: var(--input-bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23777" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>') no-repeat 14px center; color: var(--text-color); outline: none; font-size: 0.95rem; transition: all 0.3s; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
    #global-search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    #search-results { display: none; position: absolute; top: 45px; left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); max-height: 350px; overflow-y: auto; z-index: 100; animation: fadeIn 0.2s ease-out; }
    .search-result-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: rgba(37, 99, 235, 0.08); }
    [data-theme="dark"] .search-result-item:hover { background: rgba(37, 99, 235, 0.15); }

    /* Custom Ticket Dashboard Tables Styling */
    #user-story-dashboard-table th { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); }
    #user-story-dashboard-table th, #user-story-dashboard-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
    #user-story-dashboard-table tr:hover { background: rgba(0,0,0,0.015); }
    [data-theme="dark"] #user-story-dashboard-table tr:hover { background: rgba(255,255,255,0.015); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar">
    <div class="sidebar-header" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
      <img src="./icon-192.png" alt="Logo" style="width: 28px; height: 28px; border-radius: 6px;">
      <span>Tester's SOP</span>
    </div>
    
    <button class="accordion active">Test Design & Management</button>
    <div class="panel" style="max-height: 500px;">
      <button class="panel-btn active-module" onclick="loadModule('ai_generation')">AI Scenario Generation</button>
      <button class="panel-btn" onclick="loadModule('test_design')">Test Design & Xray Management</button>
      <button class="panel-btn" onclick="loadModule('scenario_validation')">Scenario Validation</button>
    </div>

    <button class="accordion">Test Execution</button>
    <div class="panel">
      <button class="panel-btn" onclick="loadModule('uat')">1. UAT Testing</button>
      <button class="panel-btn" onclick="loadModule('smoke')">2. Smoke Testing (PRL)</button>
      <button class="panel-btn" onclick="loadModule('prl')">3. PRL Testing</button>
      <button class="panel-btn" onclick="loadModule('regression')">4. Regression Testing</button>
    </div>

    <button class="accordion">Defect Management</button>
    <div class="panel">
      <button class="panel-btn" onclick="loadModule('bugs')">Bugs Workflow</button>
      <button class="panel-btn" onclick="loadModule('incidents')">Incidents Workflow</button>
    </div>

    <button class="accordion">Specialized Testing</button>
    <div class="panel">
      <button class="panel-btn" onclick="loadModule('integrated')">Integrated Testing</button>
      <button class="panel-btn" onclick="loadModule('api_testing')">API Testing Workflow</button>
      <button class="panel-btn" onclick="loadModule('ui_ux')">UI/UX & Smartwatch Testing</button>
      <button class="panel-btn" onclick="loadModule('mobile')">Mobile Testing</button>
    </div>

    <button class="accordion">Agile & Ceremonies</button>
    <div class="panel">
      <button class="panel-btn" onclick="loadModule('agile')">Agile/Scrum Workflow</button>
      <button class="panel-btn" onclick="loadModule('demo')">DEMO Presentation</button>
      <button class="panel-btn" onclick="loadModule('timelogging')">Logging Time & Teams</button>
      <button class="panel-btn" onclick="loadModule('waterfall')">Waterfall Workflow</button>
    </div>
  </aside>

  <main class="main-content">
    <nav class="top-nav">
      <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
        <img src="./icon-192.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 6px;">
        <div id="current-module-title" style="font-weight: bold; font-size: 1.4rem; color: var(--primary);">Select a Module</div>
      </div>
      <div class="search-container">
        <input type="text" id="global-search" placeholder="Search guidelines, checklists, templates..." oninput="handleSearch(this.value)">
        <div id="search-results"></div>
      </div>
      <div><button class="theme-toggle" onclick="toggleTheme()">Toggle Dark Mode</button></div>
    </nav>

    <div class="content-area">
      <div class="tabs" id="tabs-container" style="display: none;">
        <button class="tab-btn active" onclick="switchTab('guidelines')">Guidelines & Rules</button>
        <button class="tab-btn" onclick="switchTab('flowchart')">Workflow Chart</button>
        <button class="tab-btn" onclick="switchTab('checklist')">Standard Operating Procedure</button>
        <button class="tab-btn" onclick="switchTab('templates')">Templates</button>
        
      </div>

      <div id="tab-guidelines" class="tab-content"></div>
      
      <div id="tab-flowchart" class="tab-content">
        <div class="mermaid-wrapper" id="mermaid-container"></div>
      </div>
      
      <div id="tab-checklist" class="tab-content">
        <!-- User Story Context Selector & Excel Tools -->
        <div id="user-story-bar-container" class="user-story-bar-container" style="background: var(--bg-color); padding: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1; min-width: 280px; flex-wrap: wrap;">
            <span style="font-weight: 600; font-size: 0.95rem; white-space: nowrap;">User Story:</span>
            <input type="text" id="user-story-input" placeholder="e.g. SCRT-1234" class="form-input" style="max-width: 180px; padding: 8px 12px; margin: 0;" oninput="handleUserStoryKeyChange()">
            <select id="user-story-select" class="form-input" style="max-width: 180px; padding: 8px 12px; margin: 0;" onchange="handleUserStorySelect(this.value)">
              <option value="">-- Recent User Stories --</option>
            </select>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-success" id="export-excel-btn" style="margin: 0; padding: 8px 15px; font-size: 0.85rem; background: var(--success);" onclick="exportSingleUserStoryToExcel()">Export User Story</button>
            <button class="btn btn-primary" id="export-all-excel-btn" style="margin: 0; padding: 8px 15px; font-size: 0.85rem; background: var(--primary);" onclick="exportAllUserStoriesToExcel()">Export Workbook</button>
          </div>
        </div>

        <!-- Progress Indicator -->
        <div id="progress-bar-container" class="progress-wrapper" style="margin-bottom: 20px; background: var(--bg-color); padding: 15px; border: 1px solid var(--border); border-radius: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.95rem; font-weight: 600;">
            <span id="progress-text-label">Module Progress: 0%</span>
            <span id="progress-fraction-label" style="color: #777;">0 of 0 items checked</span>
          </div>
          <div class="progress-bar-bg" style="width: 100%; height: 12px; background: rgba(0,0,0,0.05); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); position: relative;">
            <div id="progress-bar-fill" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease; border-radius: 6px;"></div>
          </div>
        </div>

        <!-- Checklist Controls & Container -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
          <h3 style="margin: 0;">Standard Operating Procedure Checklist</h3>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-danger" id="reset-checklist-btn" style="margin: 0; padding: 8px 15px; font-size: 0.85rem;" onclick="resetCurrentChecklist()">Reset Module</button>
            <button class="btn btn-danger" id="reset-all-btn" style="margin: 0; padding: 8px 15px; font-size: 0.85rem; background: #c0392b;" onclick="resetAllData()">Reset All Stories</button>
          </div>
        </div>
        
        <div id="checklist-container" style="background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;"></div>

        <!-- Tickets Registry Dashboard -->
        <div id="user-story-dashboard-container" style="margin-top: 35px; background: var(--bg-color); padding: 20px; border: 1px solid var(--border); border-radius: 8px;">
          <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.15rem; color: var(--primary);">User Stories SOP Progress Registry</h3>
          <div style="overflow-x: auto;">
            <table id="user-story-dashboard-table" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem;">
              <thead>
                <tr style="border-bottom: 2px solid var(--border); color: #777;">
                  <th style="padding: 10px 5px;">User Story Key</th>
                  <th style="padding: 10px 5px;">Last Active Module</th>
                  <th style="padding: 10px 5px;">Module Progress</th>
                  <th style="padding: 10px 5px;">Overall Progress</th>
                  <th style="padding: 10px 5px; text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="user-story-dashboard-tbody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="tab-templates" class="tab-content"></div>
      
      
        <div id="logs-container"></div>
      </div>
    </div>
  </main>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

    // Apply saved theme preference on page load
    const savedTheme = localStorage.getItem('theme_preference');
    if (savedTheme === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
    }

    // --- DATA STORE FOR QA MODULES ---
    const qaModules = {
      "ai_generation": {
        title: "AI Scenario Generation via UiPath",
        guidelines: `<h3>Core Rules</h3>
          <ul class="guideline-list">
            <li><strong>Tools:</strong> Access UiPath Test Manager via Jira Link or URL. Authentication via email.</li>
            <li><strong>Context:</strong> ALWAYS select relevant documents (attachments/US description) for the context.</li>
            <li><strong>Evaluation:</strong> Perform Initial Evaluation (Relevance, logic, coverage) -> Detailed Evaluation (Ethics, prerequisites, acceptance criteria).</li>
            <li><strong>Integration:</strong> Saving in Test Manager automatically pushes scenarios to Jira in 'Drafturi Test Manager' Xray folder.</li>
            <li><strong>Refinement:</strong> Ensure proper limits (Max 50 steps), positive/negative constraints, and expected behavior. Tester remains final owner.</li>
          </ul>`,
        mermaid: `flowchart TD
            A["Open Test Manager via Jira/URL"] --> B["Select Prompt (Positive/Negative)"]
            B --> C["Provide Context (Attach docs)"]
            C --> D["Generate Tests (Claude model)"]
            D --> E["Initial Evaluation (Logic/Relevance)"]
            E --> F{"Acceptable?"}
            F -- No --> G["Adjust Prompt & Context"] --> D
            F -- Yes --> H["Detailed Evaluation & Refine Steps"]
            H --> I["Click 'Create tests'"]
            I --> J["Tests auto-push to Jira 'Drafturi'"]
            J --> K["Assign to Self & Move to Scrum Subfolder"]`,
        checklist: {
          entry_criteria: [
            "Authenticate to UiPath Test Manager using QA Email.",
            "Select appropriate prompt from library.",
            "Select User Story attachments for context."
          ],
          exit_criteria: [
            "Perform Initial Evaluation for logical errors and relevance.",
            "Complete Detailed Evaluation and refine test steps.",
            "Verify tests are pushed to Jira Xray folder successfully.",
            "Change Assignee to self and move tests to proper Scrum folder."
          ]
        },
        templates: `<div class="code-block">Approved Prompts in Test Manager:
- Positive Scenario Test Creator
- Negative Scenario Test Creator
- Non-functional Test Case Generator
- UI/UX Non-functional Test Generator</div>`
      },
      "test_design": {
        title: "Test Design & Xray Management",
        guidelines: `<h3>Core Rules</h3>
          <ul class="guideline-list">
            <li><strong>Structure:</strong> Max 50 steps per LX. 3 columns: Action, Data, Expected Result.</li>
            <li><strong>Naming:</strong> ScrumName - USName - [scenario type] (positive, negative, regression, smoke, non-functional).</li>
            <li><strong>Call Test:</strong> Use to re-use common blocks (e.g., Login, Logout) and avoid duplication.</li>
            <li><strong>Archiving:</strong> Move outdated or unneeded LXs to the 'Arhivate' folder with 'Archived' status instead of deleting.</li>
          </ul>`,
        mermaid: `flowchart TD
            A["Analyze US/Requirement"] --> B{"Common steps?"}
            B -- Yes --> C["Use Call Test function"]
            B -- No --> D["Write new steps manually"]
            C & D --> E{"Exceeds 50 steps?"}

    // --- ACCORDION LOGIC ---
    const acc = document.getElementsByClassName("accordion");
    for (let i = 0; i < acc.length; i++) {
      acc[i].addEventListener("click", function() {
        this.classList.toggle("active");
        let panel = this.nextElementSibling;
        if (panel.style.maxHeight) { panel.style.maxHeight = null; } 
        else { panel.style.maxHeight = panel.scrollHeight + "px"; }
      });
    }

    // --- THEME TOGGLE ---
    function toggleTheme() {
      const body = document.body;
      if (body.getAttribute('data-theme') === 'dark') { 
        body.removeAttribute('data-theme'); 
        localStorage.setItem('theme_preference', 'light');
      } else { 
        body.setAttribute('data-theme', 'dark'); 
        localStorage.setItem('theme_preference', 'dark');
      }
    }

    // --- SIDEBAR TOGGLE FOR MOBILE ---
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeSidebarOnMobile() {
      if (window.innerWidth <= 768) {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      }
    }

    // --- TICKET & REGISTRY UTILITIES ---
    function getActiveUserStoryKey() {
      const input = document.getElementById('user-story-input');
      return input ? input.value.trim().toUpperCase() : '';
    }

    function getUserStoryRegistry() {
      const saved = localStorage.getItem('sop_user_story_registry');
      if (!saved) return [];
      try {
        return JSON.parse(saved);
      } catch(e) {
        return [];
      }
    }

    function addToUserStoryRegistry(storyKey) {
      if (!storyKey) return;
      const registry = getUserStoryRegistry();
      if (!registry.includes(storyKey)) {
        registry.push(storyKey);
        localStorage.setItem('sop_user_story_registry', JSON.stringify(registry));
        updateUserStoryDropdown();
      }
    }

    function saveUserStoryMetadata(storyKey, moduleId) {
      const tKey = storyKey ? storyKey : 'default';
      const meta = {
        lastUpdated: new Date().toISOString(),
        lastModuleId: moduleId
      };
      localStorage.setItem(`sop_user_story_meta_${tKey}`, JSON.stringify(meta));
    }

    function getUserStoryMetadata(storyKey) {
      const tKey = storyKey ? storyKey : 'default';
      const saved = localStorage.getItem(`sop_user_story_meta_${tKey}`);
      if (saved) {
        try { return JSON.parse(saved); } catch(e) {}
      }
      return { lastUpdated: null, lastModuleId: null };
    }

    function updateUserStoryDropdown() {
      const select = document.getElementById('user-story-select');
      if (!select) return;
      
      const registry = getUserStoryRegistry();
      select.innerHTML = '<option value="">-- Recent User Stories --</option>';
      
      registry.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = key;
        select.appendChild(opt);
      });
      
      const activeKey = getActiveUserStoryKey();
      if (activeKey) {
        select.value = activeKey;
      }
    }

    function getModuleProgress(moduleId, storyKey) {
      const data = qaModules[moduleId];
      if (!data || !data.checklist) return { percent: 0, checkedCount: 0, totalCount: 0 };
      
      let totalCount = 0;
      let checkedCount = 0;
      
      const tKey = storyKey ? storyKey : 'default';
      const saved = localStorage.getItem(`checklist_state_${moduleId}_${tKey}`);
      let states = {};
      if (saved) {
        try { states = JSON.parse(saved); } catch(e) {}
      }
      
      if (Array.isArray(data.checklist)) {
        totalCount = data.checklist.length;
        data.checklist.forEach((item, index) => {
          const id = `check-${moduleId}-${index}`;
          if (states[id]) checkedCount++;
        });
      } else {
        const entry = data.checklist.entry_criteria || [];
        const exit = data.checklist.exit_criteria || [];
        totalCount = entry.length + exit.length;
        entry.forEach((item, index) => {
          const id = `check-entry-${moduleId}-${index}`;
          if (states[id]) checkedCount++;
        });
        exit.forEach((item, index) => {
          const id = `check-exit-${moduleId}-${index}`;
          if (states[id]) checkedCount++;
        });
      }
      
      const percent = totalCount > 0 ? Math.round((checkedCount / totalCount) * 100) : 0;
      return { percent, checkedCount, totalCount };
    }

    function getUserStoryOverallProgress(storyKey) {
      let grandTotal = 0;
      let grandChecked = 0;
      for (const moduleId of activeChecklistModules) {
        const { checkedCount, totalCount } = getModuleProgress(moduleId, storyKey);
        grandTotal += totalCount;
        grandChecked += checkedCount;
      }
      return grandTotal > 0 ? Math.round((grandChecked / grandTotal) * 100) : 0;
    }

    function updateProgressBar() {
      const fill = document.getElementById('progress-bar-fill');
      const textLabel = document.getElementById('progress-text-label');
      const fractionLabel = document.getElementById('progress-fraction-label');
      
      if (!currentModuleId) {
        if (textLabel) textLabel.innerText = "Module Progress: 0%";
        if (fractionLabel) fractionLabel.innerText = "";

        return;
      }
      
      const storyKey = getActiveUserStoryKey();
      const { percent, checkedCount, totalCount } = getModuleProgress(currentModuleId, storyKey);
      
      if (textLabel) {
        textLabel.innerText = `Module Progress: ${percent}%`;
      }
      if (fractionLabel) {
        fractionLabel.innerText = `${checkedCount} of ${totalCount} items checked`;
      }
      if (fill) {

        let hue = Math.round((percent / 100) * 120); 
        fill.style.backgroundColor = `hsl(${hue}, 80%, 45%)`;

      if (confirm(`Are you sure you want to delete all checklist progress for user story ${key}?`)) {

        const index = registry.indexOf(key);
        if (index > -1) {
          registry.splice(index, 1);

    // --- CHECKLIST LOGIC ---

    function evaluateChecklistLogic(moduleId) {
      if (!moduleId) return;
      const data = qaModules[moduleId];
      if (!data || !data.checklist) return;
      let stateChanged = false;

      if (Array.isArray(data.checklist)) {
        let allPreviousChecked = true;
        data.checklist.forEach((item, index) => {
          const id = `check-${moduleId}-${index}`;
          const cb = document.getElementById(id);
          if (cb) {
            cb.disabled = !allPreviousChecked;
            if (cb.disabled && cb.checked) {
              cb.checked = false;
              stateChanged = true;
            }
            if (!cb.checked) {
              allPreviousChecked = false;
            }
          }
        });
      } else {
        let entryAllChecked = true;
        if (data.checklist.entry_criteria) {
          let allPreviousChecked = true;
          data.checklist.entry_criteria.forEach((item, index) => {
            const id = `check-entry-${moduleId}-${index}`;
            const cb = document.getElementById(id);
            if (cb) {
              cb.disabled = !allPreviousChecked;
              if (cb.disabled && cb.checked) {
                cb.checked = false;
                stateChanged = true;
              }
              if (!cb.checked) {
                allPreviousChecked = false;
                entryAllChecked = false;
              }
            }
          });
        }
        
        if (data.checklist.exit_criteria) {
          let allPreviousChecked = entryAllChecked;
          data.checklist.exit_criteria.forEach((item, index) => {
            const id = `check-exit-${moduleId}-${index}`;
            const cb = document.getElementById(id);
            if (cb) {
              cb.disabled = !allPreviousChecked;
              if (cb.disabled && cb.checked) {
                cb.checked = false;
                stateChanged = true;
              }
              if (!cb.checked) {
                allPreviousChecked = false;
              }
            }
          });
        }
      }
      return stateChanged;
    }

    // --- LOCAL STORAGE FUNCTIONALITY ---
    function saveChecklistState(moduleId) {
      if (!moduleId) return;
      const isSOPModule = activeChecklistModules.includes(moduleId);
      const storyKey = isSOPModule ? getActiveUserStoryKey() : '';
      const tKey = storyKey ? storyKey : 'default';
      
      const checkboxes = document.querySelectorAll('#checklist-container input[type="checkbox"]');
      const states = {};
      checkboxes.forEach(cb => {
        states[cb.id] = cb.checked;
      });
      localStorage.setItem(`checklist_state_${moduleId}_${tKey}`, JSON.stringify(states));

      if (isSOPModule) {
        if (storyKey) {
          addToUserStoryRegistry(storyKey);
        }
        saveUserStoryMetadata(storyKey, moduleId);
        updateProgressBar();
        updateUserStoryDashboard();
      }
    }

    function loadChecklistState(moduleId) {
      if (!moduleId) return;
      const isSOPModule = activeChecklistModules.includes(moduleId);
      const storyKey = isSOPModule ? getActiveUserStoryKey() : '';
      const tKey = storyKey ? storyKey : 'default';
      
      const checkboxes = document.querySelectorAll('#checklist-container input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);
      
      const saved = localStorage.getItem(`checklist_state_${moduleId}_${tKey}`);
      if (saved) {
        try {
          const states = JSON.parse(saved);
          for (const [id, checked] of Object.entries(states)) {
            const cb = document.getElementById(id);
            if (cb) {
              cb.checked = checked;
            }
          }
        } catch (e) {
          console.error("Error loading checklist state", e);
        }
      }
      
      evaluateChecklistLogic(moduleId);
      
      if (isSOPModule) {
        updateProgressBar();
      }
    }

    function handleUserStoryKeyChange() {
      const storyKey = getActiveUserStoryKey();
      if (currentModuleId) {
        loadChecklistState(currentModuleId);
      }
      updateUserStoryDashboard();

    // --- LOAD MODULE ---
    function loadModule(moduleId) {
      const data = qaModules[moduleId];
      if (!data) return;
      currentModuleId = moduleId;

      // Close sidebar if on mobile
      closeSidebarOnMobile();

      // Hide/Show User Story tracking & progress based on module type
      const isSOPModule = activeChecklistModules.includes(moduleId);
      const ticketBar = document.getElementById('user-story-bar-container');
      const progressBar = document.getElementById('progress-bar-container');
      const dashboardContainer = document.getElementById('user-story-dashboard-container');
      const resetAllBtn = document.getElementById('reset-all-btn');
      
      if (ticketBar) ticketBar.style.display = isSOPModule ? 'flex' : 'none';
      if (progressBar) progressBar.style.display = isSOPModule ? 'block' : 'none';
      if (dashboardContainer) dashboardContainer.style.display = isSOPModule ? 'block' : 'none';
      if (resetAllBtn) resetAllBtn.style.display = isSOPModule ? 'inline-block' : 'none';

      // Update Active State in Sidebar
      document.querySelectorAll('.panel-btn').forEach(btn => btn.classList.remove('active-module'));
      const sidebarBtns = document.querySelectorAll('.panel-btn');
      for (let btn of sidebarBtns) {
        if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${moduleId}'`)) {
          btn.classList.add('active-module');
          break;
        }
      }
      
      // Update Title & Show Tabs
      document.getElementById('current-module-title').innerText = data.title;
      document.getElementById('tabs-container').style.display = 'flex';

      // Load Text Content
      document.getElementById('tab-guidelines').innerHTML = data.guidelines;
      
      // Handle Templates Tab
      const templateTabBtn = document.querySelector('.tab-btn[onclick*="templates"]');
      if (data.templates && data.templates.trim() !== '' && !data.templates.includes("No specific templates required") && !data.templates.includes("Use the Testing Estimation Form")) {
          templateTabBtn.style.display = 'inline-block';
          document.getElementById('tab-templates').innerHTML = data.templates;
      } else {
          templateTabBtn.style.display = 'none';
          if (document.getElementById('tab-templates').classList.contains('active')) {
              switchTab('guidelines'); // switch to guidelines if templates tab was active
          }
      }
      
      // Render Mermaid Flowchart
      const mermaidContainer = document.getElementById('mermaid-container');
      try {
        mermaid.render('dynamic-mermaid-svg', data.mermaid, function(svgCode) {
          mermaidContainer.innerHTML = svgCode;
        });
      } catch (err) {
        mermaidContainer.innerHTML = `<p style="color:red; font-weight:bold;">Chart Syntax Error. Please check Mermaid code formatting.</p>`;
      }

      // Build Interactive Checklist
      const checklistContainer = document.getElementById('checklist-container');
      checklistContainer.innerHTML = '';
      if (Array.isArray(data.checklist)) {
        data.checklist.forEach((item, index) => {
          const id = `check-${moduleId}-${index}`;
          checklistContainer.innerHTML += `
            <div class="checklist-item">
              <input type="checkbox" id="${id}">
              <label for="${id}">${item}</label>
            </div>`;
        });
      } else if (data.checklist) {
        if (data.checklist.entry_criteria && data.checklist.entry_criteria.length > 0) {
          checklistContainer.innerHTML += `<div style="padding: 10px 15px; font-weight: bold; background: rgba(37, 99, 235, 0.08); border-bottom: 1px solid var(--border);">Entry Criteria</div>`;
          data.checklist.entry_criteria.forEach((item, index) => {
            const id = `check-entry-${moduleId}-${index}`;
            checklistContainer.innerHTML += `
              <div class="checklist-item">
                <input type="checkbox" id="${id}">
                <label for="${id}">${item}</label>
              </div>`;
          });
        }
        if (data.checklist.exit_criteria && data.checklist.exit_criteria.length > 0) {
          checklistContainer.innerHTML += `<div style="padding: 10px 15px; font-weight: bold; background: rgba(16, 185, 129, 0.08); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border);">Exit Criteria</div>`;
          data.checklist.exit_criteria.forEach((item, index) => {
            const id = `check-exit-${moduleId}-${index}`;
            checklistContainer.innerHTML += `
              <div class="checklist-item">
                <input type="checkbox" id="${id}">
                <label for="${id}">${item}</label>
              </div>`;
          });
        }
      }

      // Restore checklist checked state from localStorage
      loadChecklistState(moduleId);

      switchTab('guidelines'); // Default to Guidelines instead of Standard Operating Procedure now that it's simpler
    }

    // Set up global event delegation for saving checkbox changes
    document.getElementById('checklist-container').addEventListener('change', function(e) {
      if (e.target && e.target.type === 'checkbox' && currentModuleId) {
        evaluateChecklistLogic(currentModuleId);
        saveChecklistState(currentModuleId);
      }
    });

    // --- TAB SWITCHING ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      
      // Find the button that called this and make it active
      const buttons = document.querySelectorAll('.tab-btn');
      for(let btn of buttons) {
        if(btn.getAttribute('onclick').includes(tabId)) {
          btn.classList.add('active');
          break;
        }
      }
      
      // Mermaid fix for rendering inside hidden tabs
      if(tabId === 'flowchart' && currentModuleId) {
          const data = qaModules[currentModuleId];
          try {
            mermaid.render('dynamic-mermaid-svg', data.mermaid, function(svgCode) {
              document.getElementById('mermaid-container').innerHTML = svgCode;
            });
          } catch(e) {}
      }
    }

    // --- GLOBAL SEARCH ---
    function handleSearch(query) {
      const resultsContainer = document.getElementById('search-results');
      if (!query || query.trim() === '') {
        resultsContainer.style.display = 'none';
        resultsContainer.innerHTML = '';
        return;
      }
      
      const q = query.toLowerCase().trim();
      const results = [];
      
      for (const [key, module] of Object.entries(qaModules)) {
        let matchScore = 0;
        let matchDetails = [];
        
        if (module.title.toLowerCase().includes(q)) {
          matchScore += 10;
          matchDetails.push("Title Match");
        }
        
        const guidelinesText = module.guidelines.replace(/<[^>]*>/g, '').toLowerCase();
        if (guidelinesText.includes(q)) {
          matchScore += 5;
          matchDetails.push("Guidelines");
        }
        
        let checklistMatch = false;
        if (Array.isArray(module.checklist)) {
          checklistMatch = module.checklist.some(item => item.toLowerCase().includes(q));
        } else {
          const entryMatch = module.checklist.entry_criteria ? module.checklist.entry_criteria.some(item => item.toLowerCase().includes(q)) : false;
          const exitMatch = module.checklist.exit_criteria ? module.checklist.exit_criteria.some(item => item.toLowerCase().includes(q)) : false;
          checklistMatch = entryMatch || exitMatch;
        }
        if (checklistMatch) {
          matchScore += 3;
          matchDetails.push("Standard Operating Procedure");
        }
        
        if (module.templates && module.templates.toLowerCase().includes(q)) {
          matchScore += 2;
          matchDetails.push("Templates");
        }
        
        if (matchScore > 0) {
          results.push({
            key: key,
            title: module.title,
            score: matchScore,
            details: matchDetails.join(', ')
          });
        }
      }
      
      results.sort((a, b) => b.score - a.score);
      
      if (results.length === 0) {
        resultsContainer.innerHTML = '<div style="padding: 12px; color: #777; text-align: center;">No results found</div>';
      } else {
        resultsContainer.innerHTML = results.map(res => `
          <div class="search-result-item" onclick="selectSearchResult('${res.key}', '${res.details}')">
            <div style="font-weight: bold; color: var(--primary);">${res.title}</div>
            <div style="font-size: 0.85rem; color: #777; margin-top: 2px;">Match: ${res.details}</div>
          </div>
        `).join('');
      }
      resultsContainer.style.display = 'block';
    }
    
    function selectSearchResult(moduleId, details) {
      const sidebarBtns = document.querySelectorAll('.panel-btn');
      let targetBtn = null;
      for (let btn of sidebarBtns) {
        if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${moduleId}'`)) {
          targetBtn = btn;
          break;
        }
      }
      
      if (targetBtn) {
        const panel = targetBtn.closest('.panel');
        if (panel) {
          const accordionBtn = panel.previousElementSibling;
          if (accordionBtn && !accordionBtn.classList.contains('active')) {
            accordionBtn.click();
          }
        }
        targetBtn.click();
      } else {
        loadModule(moduleId);
      }
      
      if (details.includes("Templates")) {
        switchTab('templates');
      } else if (details.includes("Standard Operating Procedure")) {
        switchTab('checklist');
      } else {
        switchTab('guidelines');
      }
      
      document.getElementById('global-search').value = '';
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.style.display = 'none';
      resultsContainer.innerHTML = '';
    }
    
    window.addEventListener('click', function(e) {
      const searchContainer = document.querySelector('.search-container');
      if (searchContainer && !searchContainer.contains(e.target)) {
        document.getElementById('search-results').style.display = 'none';
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateUserStoryDropdown();
      updateUserStoryDashboard();
      loadModule('ai_generation');
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(registration) {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, function(err) {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
